name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/aqi-forecaster

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[api,dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Train a model on synthetic data (so API tests run)
        run: |
          python -m aqi.synthetic
          python -m aqi.train
      - name: Unit and API tests
        run: pytest -v

  docker:
    name: Build and push Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bake in the latest production model (if the pipeline has published one)
        run: |
          mkdir -p models
          if git fetch --depth 1 origin live-data 2>/dev/null; then
            git show FETCH_HEAD:models/model.joblib > models/model.joblib
            git show FETCH_HEAD:models/metrics.json > models/metrics.json
            echo "Using production model"
          else
            echo "No published model yet; the container will download it from MODEL_URL"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name api ${{ env.IMAGE }}:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health
